<section class="login-card">
  <div class="login-card__intro">
    <h2>User Login</h2>
    <p>Enter your credentials to access your account.</p>
  </div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <small *ngIf="hasError('email', 'required')">Email is required.</small>
      <small *ngIf="hasError('email', 'email')">Enter a valid email address.</small>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <small *ngIf="hasError('password', 'required')">Password is required.</small>
      <small *ngIf="hasError('password', 'minlength')">Password must be at least 8 characters.</small>
    </div>

    <div class="actions field--full">
      <button type="submit">Login</button>
    </div>

    <p class="feedback feedback--error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="feedback feedback--success" *ngIf="successMessage">{{ successMessage }}</p>
  </form>
  <p class="signup-link">Don't have an account? <a routerLink="/">Register here</a>.</p>
</section>
