<div class="confirm-overlay" *ngIf="visible" (click)="onOverlayClick($event)">
  <div class="confirm-card" role="alertdialog" aria-modal="true" [attr.aria-label]="title">

    <!-- Icon -->
    <div class="confirm-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2
                 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
    </div>

    <h2 class="confirm-title">{{ title }}</h2>
    <p class="confirm-message">{{ message }}</p>

    <div class="confirm-actions">
      <button class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button class="btn-confirm" (click)="onConfirm()">{{ confirmLabel }}</button>
    </div>

  </div>
</div>
