<section class="dashboard-container">
  <aside class="sidebar">
    <div class="sidebar__topbar">
      <app-theme-toggle />
    </div>
    <div class="sidebar__header">
      <h2>System Menu</h2>
    </div>
    <ul class="sidebar__nav">
      <li
        [class.active]="activeMenu === 'dashboard'"
        (click)="setMenu('dashboard')">
        Dashboard
      </li>
      <li
        [class.active]="activeMenu === 'users'"
        (click)="setMenu('users')">
        User Management
      </li>
      <li class="logout-item" (click)="logout()">
        Logout
      </li>
    </ul>
  </aside>

  <main class="main-content">

    <!-- Dashboard Overview Panel -->
    <div *ngIf="activeMenu === 'dashboard'" class="content-panel">
      <div class="panel-header">
        <h2>Dashboard Overview</h2>
      </div>
      <div class="panel-body">
        <p>Welcome to the dashboard, <strong class="user-highlight">{{ userName }}</strong>!</p>
        <p>This is the central hub for managing your application.</p>
        <div class="stats-cards">
          <div class="stat-card">
            <h3>Total Users</h3>
            <p class="stat-number">{{ registeredUsers.length }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- User Management Panel -->
    <div *ngIf="activeMenu === 'users'" class="content-panel">
      <div class="panel-header user-management-header">
        <h2>User Management</h2>

        <!-- Search Component -->
        <app-search-bar
          [value]="searchQuery"
          placeholder="Search by Name or Email..."
          (valueChange)="searchQuery = $event">
        </app-search-bar>
      </div>

      <div class="panel-body">

        <!-- User Table + Pagination Component -->
        <app-user-table
          [users]="displayedUsers"
          [filteredCount]="filteredUsers.length"
          [currentPage]="currentPage"
          [pageSize]="pageSize"
          [totalPages]="totalPages"
          [pageNumbers]="pageNumbers"
          (editUser)="openEditModal($event)"
          (deleteUser)="onDeleteUser($event)"
          (pageChange)="goToPage($event)"
          (prevPage)="prevPage()"
          (nextPage)="nextPage()">
        </app-user-table>

      </div>
    </div>

  </main>
</section>

<!-- Edit Modal Component (outside main flow, fixed position) -->
<app-user-form-modal
  [user]="editingUser"
  (save)="onSaveEdit($event)"
  (cancel)="onCancelEdit()">
</app-user-form-modal>
